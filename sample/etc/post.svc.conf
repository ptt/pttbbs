# ==============================================================================
# Post & Comment Service Configuration (post.svc.conf)
# ==============================================================================
#
# Location: $BBSHOME/etc/post.svc.conf
#
# Syntax:
#   key = value
#   [section]
#
# All parameters can be overridden at runtime by passing command line flags
# to post.svc (e.g., post.svc -config /path/to/post.svc.conf).
#

[global]
# Total Pebble Block Cache memory limit across all shards (in MB).
cache_size_mb = 256

# Interval in seconds to batch flush post scores and comment counts to SQLite WAL.
flush_seconds = 2

# Minimum net new characters for a reply post before auto-demoting to comment
# (0 to disable).
min_reply_runes = 20

# Encoding for legacy BBS files and cache exports ("big5" or "utf-8").
filter_encoding = big5

# Default worker threads for board migration / import (default: 8).
# Lower values (e.g. 2-4) reduce disk I/O and CPU contention on active production nodes.
# workers = 8

# Path for UNIX domain socket IPC (default: $BBSHOME/run/post.svc.sock).
# unix_socket = ~/run/post.svc.sock

# Path to daemon log file (default: $BBSHOME/log/post.svc.log).
# log_path = ~/log/post.svc.log

# ==============================================================================
# Multi-Engine Physical Storage Locations (Sharding)
# ==============================================================================
# Specify physical directories on independent disks/mountpoints.
# When multiple engines are defined, post.svc automatically activates
# Multi-Engine Sharding with:
#   1. Independent Pebble LSM-Trees & SQLite WAL per physical disk.
#   2. Consistent community hashing across shards.
#   3. Shard-interleaved post IDs: (seq * N) + shard_id for O(1) post ID routing.
#
# Example with 8 physical disks:
# [engines]
# engine = /disk1/bbs_post_db
# engine = /disk2/bbs_post_db
# engine = /disk3/bbs_post_db
# engine = /disk4/bbs_post_db
# engine = /disk5/bbs_post_db
# engine = /disk6/bbs_post_db
# engine = /disk7/bbs_post_db
# engine = /disk8/bbs_post_db
#
# Backups: `post.ctl backup [name]` makes an online copy of every engine in
# <engine dir>/backup/<name> (default name: current time), on the same disk as
# the engine so the copy is hard-linked and takes seconds.
#
# For cron, `post.ctl daily-backup` does that and then copies each shard
# incrementally to another disk (unchanged SST files are hard-linked to the
# previous copy), verifies it and prunes old daily-* backups, e.g.:
#   15 4 * * *  bin/post.ctl daily-backup -cross -verify      # shard N -> disk N+1
#   15 4 * * *  bin/post.ctl daily-backup -dest /backup/postsvc -verify
# Each copy is a complete data dir; `post.svc -verify <dir>` checks one
# read-only. To restore, copy it back as the engine's data dir (keep
# meta.sqlite3; only run `post.svc -rebuild` if meta.sqlite3 is lost).

# By default, rendered post views are written directly to canonical BBS board
# files: $BBSHOME/boards/<C>/<Community>/<PostFile> (Single source of truth,
# zero duplicate space).  If you wish to mirror rendered views to an external
# fast cache disk (e.g. NVMe or /dev/shm), you can optionally configure
# [caches]. Otherwise, leave commented out.
# [caches]
# cache = /dev/shm/cache

# ==============================================================================
# Board Pinning (Pins)
# ==============================================================================
# Pin specific high-traffic communities to dedicated shards/disks to avoid
# hash collisions on the same physical drive.
# [pins]
# Gossiping    = 0
# Marginalman  = 1
# Baseball     = 2
# Stock        = 3
# NBA          = 4
# C_Chat       = 5
# HatePolitics = 6
# Military     = 7
