# ==============================================================================
# Gem Area Service Configuration (gem.svc.conf)
# ==============================================================================
#
# Location: $BBSHOME/etc/gem.svc.conf (optional)
#
# Syntax:
#   key = value
#   [section]
#
# Sizes take K, M and G (powers of 1024). A quota of 0 is no limit.

[global]
# Pebble block cache (MB).
cache_size_mb = 128

# Files an import reads in parallel.
workers = 8

# Where the database is kept (default: $BBSHOME/db/gem.db).
# data_dir = ~/db/gem.db

# UNIX socket (default: $BBSHOME/run/gem.svc.sock).
# unix_socket = ~/run/gem.svc.sock

# Log file (default: $BBSHOME/log/gem.svc.log).
# log_path = ~/log/gem.svc.log

# ==============================================================================
# Quotas of every board's gem area
# ==============================================================================
# A change that takes a total over its quota is refused, unless the total
# does not grow (an area over its quota may still shrink). Copies count as
# what they look like: a copied tree counts in each place.

[quota]
# Entries (files, directories, links) in the whole area.
nodes = 100000
# Directories in the whole area.
dirs = 20000
# Bytes of the files in the whole area.
bytes = 1G
# Entries in one directory.
width = 5000
# Levels of directories (MAX_MAN_DEPTH of mbbsd).
depth = 12
# Entries a single copy (paste) may bring.
copy = 10000

# ==============================================================================
# Quotas of the mail folders of people (user:<id>); the site has none
# ==============================================================================

[user_quota]
nodes = 20000
dirs = 2000
bytes = 200M
width = 5000
depth = 12
copy = 10000

# ==============================================================================
# Boards with their own quotas (they start from [quota])
# ==============================================================================
# Directories deleted in mbbsd move to the areas of these boards
# (BN_DELETED, BN_JUNK): give them no quota.
[board deleted]
nodes = 0
dirs = 0
bytes = 0
width = 0

[board junk]
nodes = 0
dirs = 0
bytes = 0
width = 0

