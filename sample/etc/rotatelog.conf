# ==============================================================================
# PTT BBS log rotation (rotatelog.conf)
# ==============================================================================
#
# Location: $BBSHOME/etc/rotatelog.conf
#
# bin/rotatelog (service/rotatelog) rotates the logs listed here. The
# crontab runs it once a day, a little after midnight (see sample/crontab),
# after the busy minute of 0:01. What is due is picked by date, and
# $BBSHOME/db/rotatelog.db/state.json remembers what was done: running it
# again the same day does nothing. Without this file, it rotates usies,
# mailog, the song log and tmp as below.
#
#   bin/rotatelog status          the entries, when last and next rotated
#   bin/rotatelog -n              what would be done now (dry run)
#   bin/rotatelog force <path>    rotate an entry now, due or not
#   bin/rotatelog check           check this file
#
# Syntax:
#
#   compress <zstd[:level] | gzip[:level] | none>   (default: zstd:9)
#   weekday <sun..sat>                              (default: sun)
#   <path> <when> <action> [copytruncate] [compress=...]
#
# compress and weekday apply to the entries after them. Paths are relative
# to BBSHOME.
#
# <when>: daily, weekly (on the weekday above), weekly:<sun..sat>, monthly
#         (on the 1st).
#
# <action>:
#   archive[:name]   Compressed into adm/YYYY/<name>/<name>-YYYYMMDD.zst and
#                    removed; <name> is the file name unless given (two logs
#                    of the same file name need one). Named after the last
#                    day it covers: the day of its last line, lines written
#                    after midnight before the rotation counting as the day
#                    before. Kept for good, one directory per year and in it
#                    one per log: remove the old years by hand
#                    (rm -rf adm/2024). usies is moved to log/usies by
#                    bin/account at 0:01, right after counting it, and
#                    archived from there; uquery.ctl import and activity.ctl
#                    diag read the archives.
#   snapshot[:name]  A directory, packed into
#                    adm/YYYY/<name>/<name>-YYYYMMDD.tar.zst (the day it is
#                    taken) and emptied.
#   trim[:size]      For logs not worth keeping (of services, daemons and
#                    cron jobs): cut to the last size bytes (default 2M; K,
#                    M, G or bytes), from a line start, in place, so that a
#                    daemon keeping it open (with O_APPEND, as >> does) goes
#                    on writing to it.
#
# copytruncate (archive): copy the log and empty it, instead of moving it,
#   for a daemon that keeps the log open (e.g. its stderr); lines written in
#   between may be lost. The programs of the BBS open their logs for each
#   line, so they need not.
#
# compress: zstd is the smallest and fast (a day of usies, 83 MB: zstd:9
#   13 MB in 2 s, zstd:19 11 MB in 4 s, gzip 18 MB in 2 s). The zstd levels
#   map to 4 speeds: 1-2 fastest, 3-5 default, 6-9 better, 10 and up best.
#   zless, zgrep and zcat do not read .zst: use zstdless, zstdgrep, zstdcat
#   (package zstd), or choose gzip to keep using them.

# Kept for good: the records to look up (who logged in, wrote, gave,
# forwarded or was punished), which nothing else keeps.
log/usies                   daily       archive
etc/mailog                  daily       archive
etc/osong.log               weekly      archive
# The transfers between users (mbbsd), once posted to Security every day.
etc/money                   daily       archive
# The bets of each lottery (openticket), once posted to Security.
log/lottery_bets.log        monthly     archive
log/activity.log            daily       archive
# The hourly snapshots of the notable users (activity.svc): to compare the
# rules before and after a change, on the same weekday and hours.
log/activity.stats.jsonl    daily       archive
log/internet_mail.log       weekly      archive
logins.bad                  weekly      archive
# The fingerprints of the terminal clients (DETECT_CLIENT), 4 bytes a login.
log/client_code             monthly     archive
# The comments, until nest.svc keeps them (LOG_CONF_PUSH).
log/push                    daily       archive

# ~/tmp, kept in adm/YYYY/tmp/tmp-YYYYMMDD.tar.zst every Saturday.
tmp                         weekly:sat  snapshot

# Only the last 2 MB: the logs of the services...
log/nest.svc.log            weekly      trim
log/ipc.svc.log             weekly      trim
log/utmp.svc.log            weekly      trim
log/friend.svc.log          weekly      trim
log/mail.svc.log            weekly      trim
log/search.svc.log          weekly      trim
log/stat.svc.log            weekly      trim
log/activity.svc.log        weekly      trim:4M
log/content.svc.log         weekly      trim
log/entropy.svc.log         weekly      trim
log/trackmail.svc.log       weekly      trim
log/uquery.svc.log          weekly      trim
# ... of the daemons (their stdout and stderr) and of mbbsd crashing...
log/boardd.grpc.log         weekly      trim
log/boardd.grpc.search.log  weekly      trim
log/mand.log                weekly      trim
log/commentd.log            weekly      trim
log/regmaild.log            weekly      trim
log/crash.log               weekly      trim
# ... and of the cron jobs (>>).
log/cleanman.log            weekly      trim
log/cleanboard.log          weekly      trim
log/cleanhome.log           weekly      trim
log/dailybackup.log         weekly      trim
log/update_online.log       weekly      trim
log/uquery.import.log       weekly      trim
log/cleanbrc.log            weekly      trim
log/expire.log              weekly      trim
log/rotatelog.log           weekly      trim
