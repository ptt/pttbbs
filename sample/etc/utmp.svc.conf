# ==============================================================================
# PTT BBS UTMP Service Configuration (utmp.svc.conf)
# ==============================================================================
#
# Location: $BBSHOME/etc/utmp.svc.conf
#
# Syntax:
#   key = value
#   -flag value
#   -flag=value
#
# All parameters can be overridden at runtime by passing command line flags
# to utmp.svc (e.g., utmp.svc -fix-interval 60s -nice -20).
#

# Update interval for sortutmp (utmp_update, online counters, hotboards cache).
# Replaces old 'shmctl utmpsortd 1300000' (1.3s / 1300ms).
# Default: 1s
interval = 1.3s

# Periodic background utmpfix interval to clean dead sessions and repair table links.
# Replaces old 'shmctl utmpfix -D 60'.
# As long as a process is alive, it is NEVER kicked.
# 0 = disabled.
# Default: 0 (disabled)
fix-interval = 60s

# OS process priority nice level (-20 to 19).
# Lower values indicate higher priority (requires root or CAP_SYS_NICE).
# Replaces old 'nice -n -20'.
# Default: -10
nice = -20

# Maximum OS threads and Goroutine execution limit.
# Default: maxprocs = 2, maxthreads = 1000
maxprocs = 2
maxthreads = 1000

# Target Go garbage collection percentage.
# Default: 50
gcpercent = 50

# Log file path.
# Default: $BBSHOME/log/utmp.svc.log
# log = /home/bbs/log/utmp.svc.log

# Verbose logging level:
# 0 = Standard logging
# 1 = Log utmp_update triggers and details
# Default: 0
verbose = 0
