# ==============================================================================
# PTT BBS Search Service Configuration (search.conf)
# ==============================================================================
#
# Location: $BBSHOME/etc/search.conf (or $BBSHOME/etc/search.svc.conf)
#
# Syntax:
#   key = value
#   -flag value
#   -flag=value
#
# All parameters can be overridden at runtime by passing command line flags
# to search.svc (e.g., search.svc -v -max-entries 4096).
#

# Maximum number of distinct search predicate combinations cached across all boards.
# Default: 2048 (Recommended for high traffic: 8192)
max-entries = 8192

# Maximum total 1-based article record indices cached in memory.
# Each index is a 4-byte int32.
# Default: 16777216 (16M ~ 64MB)
# Recommended for large sites: 67108864 (64M ~ 256MB)
max-indices = 67108864

# Maximum number of Article ID (AID / filename) lookup records cached.
# Each entry takes ~220 bytes.
# Default: 16384 (16K ~ 3.5MB)
# Recommended for heavy bot / PyPtt / wsproxy traffic: 131072 (128K ~ 28MB)
max-aid-entries = 131072

# Cache entry time-to-live before expiration.
# Default: 1h
cache-ttl = 1h

# Target Go garbage collection percentage.
# Go default is 100. Lower values trigger GC more aggressively at the cost of CPU.
# Default: 50
# Recommended: 100 (reduces GC CPU overhead on servers with ample RAM)
gcpercent = 100

# Maximum OS threads and Goroutine execution limit.
# maxprocs = 4
# maxthreads = 1000

# HTTP pprof diagnostic listener (bind to localhost only for security).
# If empty, HTTP pprof is disabled. Note that search.ctl pprof works via socket
# regardless of this setting.
# Default: disabled
pprof-addr = 127.0.0.1:6060

# Verbose logging level:
# 0 = Completely silent (recommended for production)
# 1 = Log cache misses, slow queries (>50ms), and board invalidations
# 2 = Log every query (hit & miss)
# Default: 0
verbose = 0
