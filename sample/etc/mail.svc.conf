# ==============================================================================
# PTT BBS Mail Service Configuration (mail.svc.conf)
# ==============================================================================
#
# Location: $BBSHOME/etc/mail.svc.conf
#
# Syntax:
#   key = value
#
# Keys are the command line flags of mail.svc (see `mail.svc -h`), which
# override this file (e.g., mail.svc -smtp 127.0.0.1:2525). Restart mail.svc
# after changing them, except "plain", which is read again when this file
# changes.
#

# SMTP relay, host[:port] (default: RELAY_SERVER_IP).
# smtp = 127.0.0.1:25

# Give up a mail not sent after this long (default: 24h).
# max-age = 24h

# Largest home backup to mail, in MB (default: 25), and homes packed at the
# same time (default: 1).
# zip-limit = 25
# zip-workers = 1

# ==============================================================================
# Plain mails
# ==============================================================================
# Mails are sent as UTF-8 text and HTML (multipart/alternative). Receivers
# that can't read that, like old BBSes or the bots that parse mails, may be
# listed here to get mails as the old outmail sent them: one text/plain part
# in the BBS encoding (8bit), with the article as it is (ANSI colors kept).
#
# "plain" may repeat, and may have several patterns separated by commas:
#   plain = user@host     this address
#   plain = @host         any address at host (a bare "host" is the same)
#   plain = .host         any address at a subdomain of host
#   plain = user@         user at any host
#   plain = .suffix@      any user ending with .suffix at any host
#
# Users of all BBSes, and the login bot:
# plain = .bbs@
# plain = bot@ptt.cc
