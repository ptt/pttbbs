# PTT Ban IP 封鎖設定檔
#
# 本設定檔是由一連串的區塊構成如下：
# [IP]
# [MESSAGE]
#
# 連續的 IP 描述會共享它們下面的訊息 (MESSAGE)
#
# [註解]
# # 開頭的行為註解。 在 IP 行中出現 # 其後視為註解也會被忽略。
# 但 MESSAGE 如果不是 # 開頭則後面的 # 不會被當作註解，
# 而會一起印出。例:
#
# 10.1.1.1 # 這是註解
# # 這也是註解
# 無法連線 # 這不是註解
#
# [IP]
#   - 單一 IP:     140.112.1.2
#   - 封鎖C段:     12.12.12.*  (自動視為 12.12.12.0/24)
#   - 封鎖B段:     12.12.*.*    (自動視為 12.12.0.0/16)
#   - 標準 CIDR:   34.56.78.0/24
#   - IP 區間:     10.0.0.1-10.0.0.50 或 10.0.0.1-50
#   - 一行可以多個: 10.0.0.0/24 11.1.1.1
#
# [MESSAGE]
#   - 不是以 # 開頭且單行有非 IP 內容即視為訊息。
#   - 連續的 MESSAGE 會被合併 (也就是說訊息可以多行)
#   例:    # 這不是訊息
#   例:    這當然是訊息
#   例:    1  這也是訊息
# =========================================================

